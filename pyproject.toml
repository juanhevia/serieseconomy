[project]
name = "aa-case-02-oil-price-prediction"
version = "0.1.0"
description = "Educational machine learning case study on oil price prediction using RNN, LSTM, and GRU, including data collection and supporting resources."
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas (>=3.1.0,<4.0.0)",
    "yfinance (>=1.8.0,<2.0.0)",
    "numpy (>=2.5.4,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
package-mode = false

[dependency-groups]
analysis = [
    "matplotlib (>=3.11.2,<4.0.0)",
    "nbformat (>=5.11.1,<6.0.0)",
    "nbclient (>=0.11.0,<0.12.0)",
    "nbconvert (>=7.17.2,<8.0.0)",
    "ipykernel (>=7.4.0,<8.0.0)"
]
